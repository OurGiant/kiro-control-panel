name: Build and Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn package

      - name: Get version from pom.xml
        if: startsWith(github.ref, 'refs/tags/v')
        id: version
        run: echo "version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_OUTPUT

      - name: Create installer with jpackage
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          jpackage \
            --input target/ \
            --main-jar kiro-control-panel-all.jar \
            --main-class com.ourgiant.kirocontrolpanel.TrayApp \
            --name "Kiro Control Panel" \
            --app-version ${{ steps.version.outputs.version }} \
            --type app-image \
            --icon src/packaging/app-icon.ico \
            --dest installer-output

      - name: Zip app image
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd installer-output
          7z a ../Kiro-Control-Panel-${{ steps.version.outputs.version }}.zip "Kiro Control Panel"

      - name: Upload Windows artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            Kiro-Control-Panel-${{ steps.version.outputs.version }}.zip
            target/kiro-control-panel-all.jar

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn package

      - name: Get version from pom.xml
        if: startsWith(github.ref, 'refs/tags/v')
        id: version
        run: echo "version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_OUTPUT

      - name: Create .deb package with jpackage
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          jpackage \
            --input target/ \
            --main-jar kiro-control-panel-all.jar \
            --main-class com.ourgiant.kirocontrolpanel.TrayApp \
            --name kiro-control-panel \
            --app-version ${{ steps.version.outputs.version }} \
            --vendor OurGiant \
            --type deb \
            --icon src/packaging/linux/app-icon.png \
            --description "System-tray Swing app for managing Kiro's MCP servers, steering docs, skills, hooks, and agents outside the IDE" \
            --linux-menu-group "Development;Utility;" \
            --linux-shortcut \
            --resource-dir src/packaging/linux \
            --dest installer-output

      - name: Upload Linux artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: installer-output/*.deb

  build-macos:
    strategy:
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn package

      - name: Get version from pom.xml
        if: startsWith(github.ref, 'refs/tags/v')
        id: version
        run: echo "version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_OUTPUT

      - name: Create app image with jpackage
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          jpackage \
            --input target/ \
            --main-jar kiro-control-panel-all.jar \
            --main-class com.ourgiant.kirocontrolpanel.TrayApp \
            --name "Kiro Control Panel" \
            --app-version ${{ steps.version.outputs.version }} \
            --vendor OurGiant \
            --type app-image \
            --icon src/packaging/app-icon.icns \
            --dest app-image-output

      - name: Add NSAppleEventsUsageDescription to Info.plist
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # Without this key, macOS hard-denies (error -1743) the Apple event that
          # launches Terminal.app via osascript and never shows the consent prompt
          # at all -- this only surfaces in packaged builds, not dev `java` runs,
          # since TCC attributes permission to the responsible process. See #37.
          plutil -insert NSAppleEventsUsageDescription \
            -string "Kiro Control Panel uses this to open a new Terminal window running kiro-cli in your chosen folder." \
            "app-image-output/Kiro Control Panel.app/Contents/Info.plist"

      - name: Wrap app image in .dmg with jpackage
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          jpackage \
            --type dmg \
            --app-image "app-image-output/Kiro Control Panel.app" \
            --name "Kiro Control Panel" \
            --app-version ${{ steps.version.outputs.version }} \
            --dest installer-output

      - name: Rename dmg for this architecture
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd installer-output
          mv *.dmg "Kiro-Control-Panel-${{ steps.version.outputs.version }}-${{ matrix.arch }}.dmg"

      - name: Upload macOS artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts-${{ matrix.arch }}
          path: installer-output/*.dmg

  release:
    needs: [ build-windows, build-linux, build-macos ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          files: release-artifacts/*
          generate_release_notes: true
