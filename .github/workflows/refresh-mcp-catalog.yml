name: Refresh MCP Catalog

on:
  schedule:
    - cron: '0 13 * * 1'   # Monday 13:00 UTC
  workflow_dispatch:

jobs:
  refresh-catalog:
    runs-on: ubuntu-latest
    # No pull-requests:write on purpose -- opening a PR from a workflow needs
    # the repo-wide "Allow GitHub Actions to create and approve pull requests"
    # setting, which is off here by deliberate choice (it also grants the
    # unrelated, more sensitive "approve PRs" capability, and there's no
    # narrower toggle for "create only"). Pushing a branch only needs
    # contents:write; a tracking issue only needs issues:write -- neither is
    # gated behind that setting, so PR creation stays a manual, human step.
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Regenerate catalog
        run: |
          python3 tools/generate-mcp-catalog.py > /tmp/mcp-catalog.json.new
          mv /tmp/mcp-catalog.json.new src/main/resources/mcp-catalog.json

      - name: Check for catalog changes
        id: diff
        run: |
          if git diff --quiet -- src/main/resources/mcp-catalog.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push branch with catalog changes
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b chore/refresh-mcp-catalog
          git add src/main/resources/mcp-catalog.json
          git commit -m "chore: refresh MCP catalog from kiro.dev"
          git push --force origin chore/refresh-mcp-catalog

      - name: Open tracking issue if one isn't already pending
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label catalog-refresh --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            echo "Issue #$existing is already open for a pending catalog refresh -- not creating a duplicate."
            exit 0
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "MCP catalog diff ready for review" \
            --label catalog-refresh \
            --body "tools/generate-mcp-catalog.py found a diff in kiro.dev's known MCP server list.

          Branch \`chore/refresh-mcp-catalog\` has been pushed with the regenerated \`mcp-catalog.json\`. Review the diff, and open a PR yourself when ready:

          \`\`\`
          gh pr create --repo $GITHUB_REPOSITORY --head chore/refresh-mcp-catalog --title \"chore: refresh MCP catalog from kiro.dev\"
          \`\`\`

          Or use the compare view: https://github.com/$GITHUB_REPOSITORY/compare/main...chore/refresh-mcp-catalog

          Close this issue once you've handled it (opened and merged a PR, or decided not to) -- future scheduled runs won't open a duplicate while one is already open."
